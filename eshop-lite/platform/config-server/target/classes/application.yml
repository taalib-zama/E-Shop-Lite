server:
  port: 8888
spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: file:./config-repo
      label: main
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    enabled: false
