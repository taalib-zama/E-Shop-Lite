<div class="auth-container">
  <div class="auth-card">
    <h2>Login</h2>

    <div class="alert alert-success" *ngIf="successMessage">{{ successMessage }}</div>
    <div class="alert alert-error" *ngIf="errorMessage">{{ errorMessage }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label>Email</label>
        <input formControlName="email" type="email" placeholder="john@example.com" />
        <span class="error" *ngIf="email.touched && email.errors?.['required']">Email is required</span>
        <span class="error" *ngIf="email.touched && email.errors?.['email']">Must be a valid email</span>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input formControlName="password" type="password" placeholder="Your password" />
        <span class="error" *ngIf="password.touched && password.errors?.['required']">Password is required</span>
      </div>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <p class="auth-link">Don't have an account? <a routerLink="/register">Register</a></p>
  </div>
</div>
